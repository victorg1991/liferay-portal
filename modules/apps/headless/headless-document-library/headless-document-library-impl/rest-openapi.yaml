components:
  schemas:
    Comment:
      description: https://www.schema.org/Comment
      properties:
        comments:
          items:
            $ref: "#/components/schemas/Comment"
          type: array
        creator:
          $ref: "#/components/schemas/Creator"
        id:
          format: int64
          type: integer
        text:
          type: string
      type: object
    Creator:
      description: https://www.schema.org/Creator
      properties:
        additionalName:
          type: string
        alternateName:
          type: string
        email:
          type: string
        familyName:
          type: string
        givenName:
          type: string
        id:
          format: int64
          type: integer
        image:
          format: uri
          type: string
        jobTitle:
          type: string
        name:
          type: string
        profileURL:
          type: string
      type: object
    Document:
      description: https://www.schema.org/Document
      properties:
        adaptedMedia:
          description: https://www.schema.org/ImageObject
          properties:
            contentUrl:
              format: uri
              type: string
            height:
              type: number
            id:
              format: int64
              type: integer
            resolutionName:
              type: string
            sizeInBytes:
              type: number
            width:
              type: number
          type: object
        category:
          items:
            format: int64
            type: integer
          type: array
        contentUrl:
          format: binary
          type: string
        creator:
          $ref: "#/components/schemas/Creator"
        dateCreated:
          format: date-time
          type: string
        dateModified:
          format: date-time
          type: string
        description:
          type: string
        encodingFormat:
          type: string
        fileExtension:
          type: string
        folder:
          allOf:
            - $ref: "#/components/schemas/Folder"
          readOnly: true
        folderId:
          format: int64
          type: integer
          writeOnly: true
        id:
          format: int64
          type: integer
        keywords:
          items:
            type: string
          type: array
        sizeInBytes:
          type: number
        title:
          type: string
      type: object
    Folder:
      description: https://www.schema.org/Folder
      properties:
        dateCreated:
          format: date-time
          type: string
        dateModified:
          format: date-time
          type: string
        description:
          type: string
        documents:
          items:
            $ref: "#/components/schemas/Document"
          readOnly: true
          type: array
        documentsIds:
          items:
            format: int64
            type: integer
          type: array
          writeOnly: true
        documentsRepository:
          allOf:
            - $ref: "#/components/schemas/Folder"
          readOnly: true
        documentsRepositoryId:
          format: int64
          type: integer
          writeOnly: true
        id:
          format: int64
          type: integer
        name:
          type: string
        subFolders:
          items:
            $ref: "#/components/schemas/Folder"
          type: array
      type: object
